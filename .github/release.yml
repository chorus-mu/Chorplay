changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
  categories:
    - title: "🚀 New Features"
      labels:
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
    - title: "💅 UI/UX Improvements"
      labels:
        - "ui"
    - title: "▶️ Playback and Extraction"
      labels:
        - "player"
        - "extraction"
        - "algorithm"
        - "sync"
    - title: "🌍 Translations"
      labels:
        - "localization"
    - title: "🔧 Under the Hood"
      labels:
        - "build"
        - "ci"
        - "documentation"
