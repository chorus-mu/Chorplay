android.useAndroidX=true
kotlin.code.style=officialn
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true

# The version the next release will carry; nightly builds are named <this>-nightly.<run>+<sha>.
chorplay.nightlyBaseVersion=3.0.0
